<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.4" />
    </filter>
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" />

  <!-- Shield Base -->
  <path d="M256 64 C340 64, 400 90, 400 90 V230 C400 340, 290 416, 256 448 C222 416, 112 340, 112 230 V90 C112 90, 172 64, 256 64 Z" 
        fill="url(#shieldGrad)" filter="url(#dropShadow)" />
  
  <path d="M256 80 C326 80, 380 102, 380 102 V226 C380 324, 284 394, 256 424 C228 394, 132 324, 132 226 V102 C132 102, 186 80, 256 80 Z" 
        fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4" />

  <!-- Lightning Bolt -->
  <path d="M280 110 L170 270 H250 L220 402 L342 230 H260 L280 110 Z" 
        fill="url(#boltGrad)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" filter="url(#boltGlow)" />
</svg>
